<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurt Yogreek - Deluxe Card Collection</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #FFFDF9 0%, #FFF3EC 50%, #FEEFEE 100%);
            min-height: 100vh;
        }
        .bg-blob-1 {
            position: absolute; top: -60px; left: -60px; width: 220px; height: 220px;
            background: rgba(254, 205, 211, 0.45); border-radius: 50%; filter: blur(50px); z-index: -1;
        }
        .bg-blob-2 {
            position: absolute; bottom: 20px; right: -60px; width: 240px; height: 240px;
            background: rgba(254, 243, 199, 0.6); border-radius: 50%; filter: blur(50px); z-index: -1;
        }
        .card-common { background: #ffffff; border-color: #e2e8f0; }
        .card-rare { 
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfeff 100%); 
            border-color: #38bdf8; 
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25); 
        }
        .card-epic { 
            background: linear-gradient(135deg, #faf5ff 0%, #fdf4f8 100%); 
            border-color: #c084fc; 
            box-shadow: 0 0 25px rgba(192, 132, 252, 0.4); 
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0%, 100% { box-shadow: 0 0 20px rgba(192, 132, 252, 0.3); }
            50% { box-shadow: 0 0 35px rgba(192, 132, 252, 0.6); }
        }
        .card-hover:hover { transform: translateY(-4px); transition: all 0.25s ease; }
    </style>
</head>
<body class="text-slate-800 flex flex-col relative overflow-x-hidden">

    <!-- Background Decorative Elements -->
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm border-b border-amber-100/60 sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl animate-bounce">🥣</span>
                <h1 class="font-bold text-lg text-pink-600 tracking-wide">Gurt Yogreek</h1>
            </div>
            <div class="flex space-x-1 bg-amber-100/50 p-1 rounded-xl text-xs font-medium border border-amber-200/50">
                <button id="btn-customer" class="px-3.5 py-1.5 rounded-lg transition bg-white text-pink-600 shadow-sm font-semibold">Customer Album</button>
                <button id="btn-staff" class="px-3.5 py-1.5 rounded-lg transition text-slate-600 hover:text-pink-600">Staff Portal</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 w-full flex-grow pb-12">

        <!-- ================= CUSTOMER TAB ================= -->
        <section id="tab-customer" class="space-y-4">
            
            <!-- Profile Banner (Auto loaded via LINE LIFF) -->
            <div class="bg-gradient-to-br from-pink-500 via-rose-500 to-orange-400 text-white p-5 rounded-3xl shadow-xl shadow-pink-500/10 space-y-3 relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 text-8xl opacity-10">🍓</div>
                <div class="flex justify-between items-center relative z-10">
                    <div>
                        <p class="text-xs text-pink-100 font-medium">Logged in via LINE</p>
                        <h3 id="disp-name" class="font-bold text-base truncate max-w-[180px]">Loading profile...</h3>
                    </div>
                    <div class="text-right">
                        <span class="text-xs bg-white/20 backdrop-blur-md px-3 py-1 rounded-full font-semibold">Collected <span id="disp-count">0</span>/<span id="disp-total">0</span></span>
                    </div>
                </div>
                <!-- Progress Bar -->
                <div class="w-full bg-black/20 rounded-full h-3 overflow-hidden p-0.5 relative z-10">
                    <div id="progress-bar" class="bg-amber-300 h-2 rounded-full transition-all duration-700 shadow-inner" style="width: 0%"></div>
                </div>
            </div>

            <!-- Upload Slip & Auto Draw Card -->
            <div class="bg-white/90 backdrop-blur-sm p-4 rounded-3xl shadow-sm border border-amber-100 space-y-3">
                <h2 class="font-semibold text-slate-700 flex items-center gap-1.5 text-sm"><span>💳</span> Submit Slip & Draw Card</h2>
                <div class="space-y-2">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1 font-medium">Upload Transfer Slip (Image)</label>
                        <input type="file" id="slip-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-pink-50 file:text-pink-600 hover:file:bg-pink-100 cursor-pointer">
                    </div>
                    <button id="btn-upload-slip" class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 text-white py-3 rounded-2xl text-sm font-medium hover:opacity-90 transition shadow-lg shadow-indigo-500/20">🚀 Upload Slip & Draw Card!</button>
                </div>
            </div>

            <!-- Reward Status Box -->
            <div class="bg-white/90 backdrop-blur-sm p-4 rounded-3xl shadow-sm border border-amber-100 flex justify-between items-center">
                <div>
                    <h3 class="font-semibold text-sm text-slate-700 flex items-center gap-1.5"><span>🎁</span> Complete Collection Reward</h3>
                    <p class="text-xs text-slate-400 mt-0.5">Free 1 Premium Greek Yogurt Cup</p>
                </div>
                <button id="btn-claim" disabled class="bg-slate-200 text-slate-400 px-4 py-2.5 rounded-2xl text-xs font-semibold cursor-not-allowed transition">Claim</button>
            </div>

            <!-- Card Grid -->
            <div>
                <h3 class="font-semibold text-sm mb-3 text-slate-700 flex items-center gap-1.5"><span>🎴</span> Ingredient Catalog <span class="text-[11px] font-normal text-slate-400">(Tap for details)</span></h3>
                <div id="album-grid" class="grid grid-cols-2 gap-3"></div>
            </div>

        </section>

        <!-- ================= STAFF TAB ================= -->
        <section id="tab-staff" class="hidden space-y-4">
            <div class="bg-white/90 backdrop-blur-sm p-5 rounded-3xl shadow-sm border border-amber-100 space-y-4">
                <h2 class="font-semibold text-slate-700 flex items-center gap-1.5 text-sm"><span>⚡</span> Staff Manual Override</h2>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Customer LINE UID / Phone</label>
                        <input type="text" id="staff-uid" placeholder="Enter customer identifier" class="w-full border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:border-pink-500 bg-amber-50/30">
                    </div>
                </div>

                <button id="btn-staff-draw" class="w-full bg-slate-900 text-white py-3 rounded-2xl text-sm font-medium hover:bg-slate-800 transition shadow-lg shadow-slate-900/20">🎲 Draw Random Card (Staff)</button>
            </div>
        </section>

    </main>

    <!-- Card Detail Modal -->
    <div id="card-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-xs rounded-3xl p-6 text-center space-y-4 shadow-2xl relative border border-pink-100">
            <button id="btn-close-modal" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold bg-slate-100 w-8 h-8 rounded-full flex items-center justify-center transition">✕</button>
            <div id="modal-icon" class="text-7xl my-2">🥣</div>
            <h3 id="modal-name" class="font-bold text-lg text-slate-800">-</h3>
            <span id="modal-rarity" class="inline-block px-3 py-1 rounded-full text-xs font-semibold shadow-sm">Common</span>
            <p id="modal-desc" class="text-xs text-slate-500 leading-relaxed bg-amber-50/50 p-3 rounded-2xl">-</p>
        </div>
    </div>

    <!-- Card Draw Result / Reveal Modal -->
    <div id="draw-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-xs rounded-3xl p-6 text-center space-y-4 shadow-2xl relative border-2 border-pink-300 animate-in fade-in zoom-in duration-300">
            <div class="absolute -top-10 left-1/2 -translate-x-1/2 text-5xl bg-amber-200 w-16 h-16 rounded-full flex items-center justify-center shadow-lg">🎉</div>
            <div class="pt-4">
                <p class="text-xs font-bold text-pink-600 uppercase tracking-wider">Slip Verified & Card Unlocked!</p>
                <div id="draw-icon" class="text-7xl my-3 animate-bounce">🍓</div>
                <h3 id="draw-name" class="font-bold text-xl text-slate-800">-</h3>
                <span id="draw-rarity" class="inline-block px-3 py-1 rounded-full text-xs font-semibold shadow-sm my-1">Common</span>
                <p id="draw-desc" class="text-xs text-slate-500 leading-relaxed bg-amber-50/50 p-3 rounded-2xl mt-2">-</p>
            </div>
            <button id="btn-close-draw" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white py-3 rounded-2xl text-sm font-semibold hover:opacity-90 transition shadow-md">Awesome! 🎴</button>
        </div>
    </div>

    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://rkqhbszezansedzdhhgf.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrcWhic3plemFuc2VkemRoaGdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MDA5MDMsImV4cCI6MjEwOTA3NjkwM30.3ctDY_6idWAbFOVgO2srgQTC-j7SGEwKz1x2QhhKICw';
        const LIFF_ID = 'YOUR_LIFF_ID'; // ใส่ LIFF ID ของคุณที่นี่
        
        let supabaseClient = null;
        let currentUid = '';
        let currentDisplayName = '';

        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (e) {
            console.error("Supabase Init Error:", e);
        }

        const CATALOG = [
            { id: "c1", name: "Greek Original", rarity: "Common", desc: "Rich and creamy signature original yogurt. Smooth texture and perfectly balanced flavor.", icon: "🥣" },
            { id: "c2", name: "Wild Honey", rarity: "Common", desc: "100% pure wild flower honey. Adds a natural floral sweetness to every bite.", icon: "🍯" },
            { id: "c3", name: "Granola Crunchy", rarity: "Common", desc: "House-secret roasted crunchy grains. Fun to chew and keeps you energized.", icon: "🌾" },
            { id: "c4", name: "Fresh Strawberry", rarity: "Rare", desc: "Premium fresh strawberries. Plump, juicy, with a delightful sweet & tangy taste.", icon: "🍓" },
            { id: "c5", name: "Almond Roast", rarity: "Rare", desc: "Freshly roasted aromatic almonds packed with premium nutrition and crunch.", icon: "🥜" },
            { id: "c6", name: "Special Mascot Gurt", rarity: "Epic", desc: "Legendary ultra-rare secret mascot card of Gurt Yogreek! Ultimate collector item.", icon: "🦄" }
        ];

        function switchTab(tab) {
            const isC = tab === 'customer';
            document.getElementById('tab-customer').classList.toggle('hidden', !isC);
            document.getElementById('tab-staff').classList.toggle('hidden', isC);
            document.getElementById('btn-customer').className = isC ? 'px-3.5 py-1.5 rounded-lg transition bg-white text-pink-600 shadow-sm font-semibold' : 'px-3.5 py-1.5 rounded-lg transition text-slate-600 hover:text-pink-600';
            document.getElementById('btn-staff').className = !isC ? 'px-3.5 py-1.5 rounded-lg transition bg-white text-pink-600 shadow-sm font-semibold' : 'px-3.5 py-1.5 rounded-lg transition text-slate-600 hover:text-pink-600';
        }

        // Initialize LINE LIFF and load user data automatically
        async function initLiff() {
            try {
                if (typeof liff !== 'undefined' && LIFF_ID !== 'YOUR_LIFF_ID') {
                    await liff.init({ liffId: LIFF_ID });
                    if (!liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        const profile = await liff.getProfile();
                        currentUid = profile.userId;
                        currentDisplayName = profile.displayName;
                        document.getElementById('disp-name').innerText = currentDisplayName;
                        await loadUserAlbum(currentUid);
                    }
                } else {
                    // Fallback สำหรับทดสอบนอก LINE Browser
                    currentUid = 'TEST_USER_12345';
                    currentDisplayName = 'Test Customer';
                    document.getElementById('disp-name').innerText = currentDisplayName;
                    await loadUserAlbum(currentUid);
                }
            } catch (error) {
                console.error('LIFF initialization failed:', error);
                currentUid = 'TEST_USER_12345';
                document.getElementById('disp-name').innerText = 'Fallback User';
                await loadUserAlbum(currentUid);
            }
        }

        async function loadUserAlbum(uid) {
            if (!supabaseClient) return;
            try {
                let { data, error } = await supabaseClient.from('members').select('*').eq('line_uid', uid).maybeSingle();
                
                if (error) {
                    console.error("Supabase Select Error:", error);
                    return;
                }

                let cards = data ? data.cards || [] : [];

                if(!data) {
                    await supabaseClient.from('members').insert([{ line_uid: uid, cards: [] }]);
                }

                renderGrid(cards);
            } catch (err) {
                console.error("Unexpected Error:", err);
            }
        }

        // Upload slip and auto draw card
        async function uploadSlipAndDraw() {
            if (!supabaseClient) {
                alert('⚠️ Supabase client is not initialized.');
                return;
            }
            if (!currentUid) {
                alert('⚠️ LINE User ID is not ready yet.');
                return;
            }

            const fileInput = document.getElementById('slip-file');
            const file = fileInput.files[0];

            if (!file) { alert('Please select a payment slip image to upload.'); return; }

            try {
                // 1. Upload slip image to Supabase Storage bucket 'payment-slips'
                const fileExt = file.name.split('.').pop();
                const fileName = `${currentUid}_${Date.now()}.${fileExt}`;
                
                const { error: uploadError } = await supabaseClient.storage
                    .from('payment-slips')
                    .upload(fileName, file);

                if (uploadError) {
                    console.error("Upload Slip Error:", uploadError);
                    alert('❌ Failed to upload slip: ' + uploadError.message);
                    return;
                }

                // 2. Auto draw random card
                const rand = Math.random() * 100;
                let rarity = 'Common';
                if(rand > 95) rarity = 'Epic';
                else if(rand > 70) rarity = 'Rare';

                const filtered = CATALOG.filter(c => c.rarity === rarity);
                const card = filtered[Math.floor(Math.random() * filtered.length)];

                // 3. Update member cards in table 'members'
                let { data } = await supabaseClient.from('members').select('*').eq('line_uid', currentUid).maybeSingle();
                let cards = data ? data.cards || [] : [];
                if(!cards.includes(card.id)) cards.push(card.id);

                await supabaseClient.from('members').upsert({ line_uid: currentUid, cards: cards, updated_at: new Date() });

                // Reset slip input
                fileInput.value = '';

                // 4. Show reveal modal
                showDrawResultModal(card);
                
                // Refresh background album grid
                renderGrid(cards);

            } catch (err) {
                console.error("Unexpected Error:", err);
                alert('❌ Unexpected error: ' + err.message);
            }
        }

        function showDrawResultModal(card) {
            document.getElementById('draw-icon').innerText = card.icon;
            document.getElementById('draw-name').innerText = card.name;
            document.getElementById('draw-desc').innerText = card.desc;
            const rarityEl = document.getElementById('draw-rarity');
            rarityEl.innerText = card.rarity;
            rarityEl.className = `inline-block px-3 py-1 rounded-full text-xs font-semibold shadow-sm ${card.rarity === 'Epic' ? 'bg-purple-100 text-purple-700' : card.rarity === 'Rare' ? 'bg-cyan-100 text-cyan-700' : 'bg-slate-100 text-slate-700'}`;
            document.getElementById('draw-modal').classList.remove('hidden');
        }

        function closeDrawModal() {
            document.getElementById('draw-modal').classList.add('hidden');
        }

        function renderGrid(userCards) {
            const grid = document.getElementById('album-grid');
            grid.innerHTML = '';
            let count = 0;

            CATALOG.forEach(card => {
                const owned = userCards.includes(card.id);
                if(owned) count++;

                let tierClass = 'card-common';
                let badgeStyle = 'bg-slate-100 text-slate-600 border-slate-200';
                if(owned && card.rarity === 'Epic') {
                    tierClass = 'card-epic';
                    badgeStyle = 'bg-purple-100 text-purple-700 border-purple-300';
                } else if(owned && card.rarity === 'Rare') {
                    tierClass = 'card-rare';
                    badgeStyle = 'bg-cyan-100 text-cyan-700 border-cyan-300';
                } else if(!owned) {
                    tierClass = 'bg-slate-50/60 border-slate-200 opacity-40 grayscale';
                }

                const el = document.createElement('div');
                el.className = `p-3.5 rounded-3xl border transition card-hover cursor-pointer flex flex-col justify-between ${tierClass}`;
                el.addEventListener('click', () => openModal(card, owned));
                el.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-3xl">${card.icon}</span>
                            <span class="text-[9px] px-2.5 py-0.5 rounded-full border font-bold ${badgeStyle}">${card.rarity}</span>
                        </div>
                        <h4 class="font-bold text-xs text-slate-800">${card.name}</h4>
                    </div>
                    <div class="mt-3 pt-2 border-t border-slate-100/80 text-[10px] font-medium flex items-center justify-between">
                        <span class="${owned ? 'text-pink-600 font-semibold' : 'text-slate-400'}">${owned ? '✓ Collected' : '🔒 Locked'}</span>
                    </div>
                `;
                grid.appendChild(el);
            });

            document.getElementById('disp-count').innerText = count;
            document.getElementById('disp-total').innerText = CATALOG.length;
            const percent = (count / CATALOG.length) * 100;
            document.getElementById('progress-bar').style.width = `${percent}%`;

            const btnClaim = document.getElementById('btn-claim');
            if(count >= CATALOG.length) {
                btnClaim.disabled = false;
                btnClaim.className = 'bg-gradient-to-r from-emerald-500 to-teal-500 text-white px-4 py-2.5 rounded-2xl text-xs font-semibold hover:opacity-90 shadow-md shadow-emerald-500/20 cursor-pointer transition';
            }
        }

        function openModal(card, owned) {
            document.getElementById('modal-icon').innerText = card.icon;
            document.getElementById('modal-name').innerText = card.name;
            document.getElementById('modal-desc').innerText = owned ? card.desc : '🔒 You haven’t collected this card yet. Purchase special store menus to draw it!';
            const rarityEl = document.getElementById('modal-rarity');
            rarityEl.innerText = card.rarity;
            rarityEl.className = `inline-block px-3 py-1 rounded-full text-xs font-semibold shadow-sm ${card.rarity === 'Epic' ? 'bg-purple-100 text-purple-700' : card.rarity === 'Rare' ? 'bg-cyan-100 text-cyan-700' : 'bg-slate-100 text-slate-700'}`;
            document.getElementById('card-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('card-modal').classList.add('hidden');
        }

        async function staffDrawCard() {
            if (!supabaseClient) {
                alert('⚠️ Supabase client is not initialized.');
                return;
            }
            const uid = document.getElementById('staff-uid').value.trim();

            if(!uid) { alert('Please enter customer UID.'); return; }

            const rand = Math.random() * 100;
            let rarity = 'Common';
            if(rand > 95) rarity = 'Epic';
            else if(rand > 70) rarity = 'Rare';

            const filtered = CATALOG.filter(c => c.rarity === rarity);
            const card = filtered[Math.floor(Math.random() * filtered.length)];

            let { data } = await supabaseClient.from('members').select('*').eq('line_uid', uid).maybeSingle();
            let cards = data ? data.cards || [] : [];
            if(!cards.includes(card.id)) cards.push(card.id);

            await supabaseClient.from('members').upsert({ line_uid: uid, cards: cards, updated_at: new Date() });

            alert(`[Staff] Successfully issued "${card.name}" (${card.rarity}) to ${uid}!`);
        }

        function claimReward() {
            alert('Congratulations! Show this screen to our store staff to redeem your free Greek Yogurt cup.');
        }

        // Event listeners initialization
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-customer').addEventListener('click', () => switchTab('customer'));
            document.getElementById('btn-staff').addEventListener('click', () => switchTab('staff'));
            document.getElementById('btn-upload-slip').addEventListener('click', uploadSlipAndDraw);
            document.getElementById('btn-close-draw').addEventListener('click', closeDrawModal);
            document.getElementById('btn-claim').addEventListener('click', claimReward);
            document.getElementById('btn-staff-draw').addEventListener('click', staffDrawCard);
            const closeModalBtn = document.getElementById('btn-close-modal');
            if(closeModalBtn) closeModalBtn.addEventListener('click', closeModal);

            // Start LIFF Initialization
            initLiff();
        });
    </script>
</body>
</html>
