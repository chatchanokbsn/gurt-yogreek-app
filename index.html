<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurt Yogreek - Deluxe Card Collection</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #FFFDF9 0%, #FFF3EC 50%, #FEEFEE 100%);
            min-height: 100vh;
        }
        .bg-blob-1 {
            position: absolute; top: -60px; left: -60px; width: 220px; height: 220px;
            background: rgba(254, 205, 211, 0.45); border-radius: 50%; filter: blur(50px); z-index: -1;
        }
        .bg-blob-2 {
            position: absolute; bottom: 20px; right: -60px; width: 240px; height: 240px;
            background: rgba(254, 243, 199, 0.6); border-radius: 50%; filter: blur(50px); z-index: -1;
        }
        .card-common { background: #ffffff; border-color: #e2e8f0; }
        .card-rare { 
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfeff 100%); 
            border-color: #38bdf8; 
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25); 
        }
        .card-epic { 
            background: linear-gradient(135deg, #faf5ff 0%, #fdf4f8 100%); 
            border-color: #c084fc; 
            box-shadow: 0 0 25px rgba(192, 132, 252, 0.4); 
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0%, 100% { box-shadow: 0 0 20px rgba(192, 132, 252, 0.3); }
            50% { box-shadow: 0 0 35px rgba(192, 132, 252, 0.6); }
        }
        .card-hover:hover { transform: translateY(-4px); transition: all 0.25s ease; }
    </style>
</head>
<body class="text-slate-800 flex flex-col relative overflow-x-hidden">

    <!-- Background Decorative Elements -->
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm border-b border-amber-100/60 sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl animate-bounce">🥣</span>
                <h1 class="font-bold text-lg text-pink-600 tracking-wide">Gurt Yogreek</h1>
            </div>
            <div class="flex space-x-1 bg-amber-100/50 p-1 rounded-xl text-xs font-medium border border-amber-200/50">
                <button id="btn-customer" class="px-3.5 py-1.5 rounded-lg transition bg-white text-pink-600 shadow-sm font-semibold">Customer Album</button>
                <button id="btn-staff" class="px-3.5 py-1.5 rounded-lg transition text-slate-600 hover:text-pink-600">Staff Draw</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 w-full flex-grow pb-12">

        <!-- ================= CUSTOMER TAB ================= -->
        <section id="tab-customer" class="space-y-4">
            <!-- View Album Card -->
            <div class="bg-white/90 backdrop-blur-sm p-4 rounded-3xl shadow-sm border border-amber-100 space-y-3">
                <h2 class="font-semibold text-slate-700 flex items-center gap-1.5 text-sm"><span>🔍</span> Your Card Collection</h2>
                <div class="flex gap-2">
                    <input type="text" id="cust-uid" placeholder="LINE UID or Phone Number" class="flex-grow border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:border-pink-500 bg-amber-50/30">
                    <button id="btn-load-album" class="bg-gradient-to-r from-pink-500 to-rose-500 text-white px-5 py-2.5 rounded-2xl text-sm font-medium hover:opacity-90 transition shadow-md shadow-pink-500/20">View</button>
                </div>
            </div>

            <!-- Upload Slip Card -->
            <div class="bg-white/90 backdrop-blur-sm p-4 rounded-3xl shadow-sm border border-amber-100 space-y-3">
                <h2 class="font-semibold text-slate-700 flex items-center gap-1.5 text-sm"><span>💳</span> Submit Payment Slip</h2>
                <div class="space-y-2">
                    <input type="text" id="slip-uid" placeholder="LINE UID or Phone Number" class="w-full border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:border-pink-500 bg-amber-50/30">
                    <input type="text" id="slip-order-id" placeholder="Order ID / Receipt No. (e.g. ORD-001)" class="w-full border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:border-pink-500 bg-amber-50/30">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1 font-medium">Upload Transfer Slip (Image)</label>
                        <input type="file" id="slip-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-pink-50 file:text-pink-600 hover:file:bg-pink-100 cursor-pointer">
                    </div>
                    <button id="btn-upload-slip" class="w-full bg-slate-900 text-white py-2.5 rounded-2xl text-sm font-medium hover:bg-slate-800 transition shadow-md">Upload & Confirm Order</button>
                </div>
            </div>

            <div id="customer-content" class="hidden space-y-4">
                <!-- Profile & Progress Bar -->
                <div class="bg-gradient-to-br from-pink-500 via-rose-500 to-orange-400 text-white p-5 rounded-3xl shadow-xl shadow-pink-500/10 space-y-3 relative overflow-hidden">
                    <div class="absolute -right-6 -bottom-6 text-8xl opacity-10">🍓</div>
                    <div class="flex justify-between items-center relative z-10">
                        <div>
                            <p class="text-xs text-pink-100 font-medium">Collector ID</p>
                            <h3 id="disp-uid" class="font-bold text-sm truncate max-w-[180px]">-</h3>
                        </div>
                        <div class="text-right">
                            <span class="text-xs bg-white/20 backdrop-blur-md px-3 py-1 rounded-full font-semibold">Collected <span id="disp-count">0</span>/<span id="disp-total">0</span></span>
                        </div>
                    </div>
                    <!-- Progress Bar -->
                    <div class="w-full bg-black/20 rounded-full h-3 overflow-hidden p-0.5 relative z-10">
                        <div id="progress-bar" class="bg-amber-300 h-2 rounded-full transition-all duration-700 shadow-inner" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Reward Status Box -->
                <div class="bg-white/90 backdrop-blur-sm p-4 rounded-3xl shadow-sm border border-amber-100 flex justify-between items-center">
                    <div>
                        <h3 class="font-semibold text-sm text-slate-700 flex items-center gap-1.5"><span>🎁</span> Complete Collection Reward</h3>
                        <p class="text-xs text-slate-400 mt-0.5">Free 1 Premium Greek Yogurt Cup</p>
                    </div>
                    <button id="btn-claim" disabled class="bg-slate-200 text-slate-400 px-4 py-2.5 rounded-2xl text-xs font-semibold cursor-not-allowed transition">Claim</button>
                </div>

                <!-- Card Grid -->
                <div>
                    <h3 class="font-semibold text-sm mb-3 text-slate-700 flex items-center gap-1.5"><span>🎴</span> Ingredient Catalog <span class="text-[11px] font-normal text-slate-400">(Tap for details)</span></h3>
                    <div id="album-grid" class="grid grid-cols-2 gap-3"></div>
                </div>
            </div>
        </section>

        <!-- ================= STAFF TAB ================= -->
        <section id="tab-staff" class="hidden space-y-4">
            <div class="bg-white/90 backdrop-blur-sm p-5 rounded-3xl shadow-sm border border-amber-100 space-y-4">
                <h2 class="font-semibold text-slate-700 flex items-center gap-1.5 text-sm"><span>⚡</span> Staff Portal: Verified Card Draw</h2>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Customer LINE UID / Phone</label>
                        <input type="text" id="staff-uid" placeholder="Enter customer identifier" class="w-full border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:border-pink-500 bg-amber-50/30">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Order ID / Receipt Number</label>
                        <input type="text" id="staff-order-id" placeholder="e.g. ORD-98234" class="w-full border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:border-pink-500 bg-amber-50/30">
                    </div>
                    <div class="flex items-center gap-2 pt-1">
                        <input type="checkbox" id="pay-verified" class="w-4 h-4 text-pink-600 rounded border-slate-300 focus:ring-pink-500">
                        <label for="pay-verified" class="text-xs font-medium text-slate-600">Payment Confirmed (1 Order = 1 Card Draw Limit)</label>
                    </div>
                </div>

                <button id="btn-staff-draw" class="w-full bg-slate-900 text-white py-3 rounded-2xl text-sm font-medium hover:bg-slate-800 transition shadow-lg shadow-slate-900/20">🎲 Draw Random Card</button>
            </div>

            <div id="staff-result" class="hidden bg-white/90 backdrop-blur-sm p-6 rounded-3xl shadow-md border border-pink-200 text-center space-y-2">
                <p class="text-xs text-pink-600 font-bold uppercase tracking-wider">🎉 Card Issued Successfully!</p>
                <div id="res-icon" class="text-6xl my-2 animate-bounce">🍓</div>
                <h3 id="res-name" class="font-bold text-lg text-slate-800">-</h3>
                <span id="res-rarity-badge" class="inline-block px-3 py-0.5 rounded-full text-xs font-semibold">Common</span>
                <p id="res-desc" class="text-xs text-slate-500 mt-1">-</p>
            </div>
        </section>

    </main>

    <!-- Card Detail Modal -->
    <div id="card-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-xs rounded-3xl p-6 text-center space-y-4 shadow-2xl relative border border-pink-100">
            <button id="btn-close-modal" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold bg-slate-100 w-8 h-8 rounded-full flex items-center justify-center transition">✕</button>
            <div id="modal-icon" class="text-7xl my-2">🥣</div>
            <h3 id="modal-name" class="font-bold text-lg text-slate-800">-</h3>
            <span id="modal-rarity" class="inline-block px-3 py-1 rounded-full text-xs font-semibold shadow-sm">Common</span>
            <p id="modal-desc" class="text-xs text-slate-500 leading-relaxed bg-amber-50/50 p-3 rounded-2xl">-</p>
        </div>
    </div>

    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://rkqhbszezansedzdhhgf.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (e) {
            console.error("Supabase Init Error:", e);
        }

        const CATALOG = [
            { id: "c1", name: "Greek Original", rarity: "Common", desc: "Rich and creamy signature original yogurt. Smooth texture and perfectly balanced flavor.", icon: "🥣" },
            { id: "c2", name: "Wild Honey", rarity: "Common", desc: "100% pure wild flower honey. Adds a natural floral sweetness to every bite.", icon: "🍯" },
            { id: "c3", name: "Granola Crunchy", rarity: "Common", desc: "House-secret roasted crunchy grains. Fun to chew and keeps you energized.", icon: "🌾" },
            { id: "c4", name: "Fresh Strawberry", rarity: "Rare", desc: "Premium fresh strawberries. Plump, juicy, with a delightful sweet & tangy taste.", icon: "🍓" },
            { id: "c5", name: "Almond Roast", rarity: "Rare", desc: "Freshly roasted aromatic almonds packed with premium nutrition and crunch.", icon: "🥜" },
            { id: "c6", name: "Special Mascot Gurt", rarity: "Epic", desc: "Legendary ultra-rare secret mascot card of Gurt Yogreek! Ultimate collector item.", icon: "🦄" }
        ];

        function switchTab(tab) {
            const isC = tab === 'customer';
            document.getElementById('tab-customer').classList.toggle('hidden', !isC);
            document.getElementById('tab-staff').classList.toggle('hidden', isC);
            document.getElementById('btn-customer').className = isC ? 'px-3.5 py-1.5 rounded-lg transition bg-white text-pink-600 shadow-sm font-semibold' : 'px-3.5 py-1.5 rounded-lg transition text-slate-600 hover:text-pink-600';
            document.getElementById('btn-staff').className = !isC ? 'px-3.5 py-1.5 rounded-lg transition bg-white text-pink-600 shadow-sm font-semibold' : 'px-3.5 py-1.5 rounded-lg transition text-slate-600 hover:text-pink-600';
        }

        async function loadAlbum() {
            if (!supabaseClient) {
                alert('⚠️ Supabase client is not initialized.');
                return;
            }
            const uid = document.getElementById('cust-uid').value.trim();
            if(!uid) { alert('Please enter your LINE UID or Phone Number.'); return; }

            try {
                let { data, error } = await supabaseClient.from('members').select('*').eq('line_uid', uid).maybeSingle();
                
                if (error) {
                    console.error("Supabase Select Error:", error);
                    alert('❌ Error retrieving data: ' + error.message);
                    return;
                }

                let cards = data ? data.cards || [] : [];

                if(!data) {
                    let { error: insertError } = await supabaseClient.from('members').insert([{ line_uid: uid, cards: [] }]);
                    if (insertError) {
                        console.error("Supabase Insert Error:", insertError);
                        alert('❌ Error creating
