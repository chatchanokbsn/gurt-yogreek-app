<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurt Yogreek - Deluxe Card Collection</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #FAF7F2; }
        .card-glow-epic { box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); border-color: #c084fc !important; }
        .card-glow-rare { box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); border-color: #60a5fa !important; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm border-b border-amber-100 sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🥣</span>
                <h1 class="font-bold text-lg text-pink-600">Gurt Yogreek</h1>
            </div>
            <div class="flex space-x-1 bg-amber-100/60 p-1 rounded-xl text-xs font-medium">
                <button onclick="switchTab('customer')" id="btn-customer" class="px-3 py-1.5 rounded-lg transition bg-white text-pink-600 shadow-sm">อัลบั้มลูกค้า</button>
                <button onclick="switchTab('staff')" id="btn-staff" class="px-3 py-1.5 rounded-lg transition text-slate-600">พนักงาน (แจก)</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 w-full flex-grow pb-12">

        <!-- ================= CUSTOMER TAB ================= -->
        <section id="tab-customer" class="space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-amber-100">
                <h2 class="font-semibold text-slate-700 mb-2">🔍 อัลบั้มสะสมการ์ดของคุณ</h2>
                <div class="flex gap-2">
                    <input type="text" id="cust-uid" placeholder="LINE UID หรือเบอร์โทรศัพท์" class="flex-grow border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-500">
                    <button onclick="loadAlbum()" class="bg-pink-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-pink-700 transition">เปิดดู</button>
                </div>
            </div>

            <div id="customer-content" class="hidden space-y-4">
                <!-- Profile & Progress Bar -->
                <div class="bg-gradient-to-br from-pink-500 to-rose-500 text-white p-5 rounded-2xl shadow-lg space-y-3">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-xs text-pink-100">สมาชิกผู้สะสม</p>
                            <h3 id="disp-uid" class="font-bold text-sm truncate max-w-[180px]">-</h3>
                        </div>
                        <div class="text-right">
                            <span class="text-xs bg-white/20 px-2.5 py-1 rounded-full font-medium">สะสม <span id="disp-count">0</span>/<span id="disp-total">0</span></span>
                        </div>
                    </div>
                    <!-- Progress Bar -->
                    <div class="w-full bg-black/20 rounded-full h-2.5 overflow-hidden">
                        <div id="progress-bar" class="bg-amber-300 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Reward Status Box -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-amber-100 flex justify-between items-center">
                    <div>
                        <h3 class="font-semibold text-sm text-slate-700">🎁 รางวัลสะสมครบชุด</h3>
                        <p class="text-xs text-slate-400">กรีกโยเกิร์ตพรีเมียมฟรี 1 ถ้วย</p>
                    </div>
                    <button onclick="claimReward()" id="btn-claim" disabled class="bg-slate-200 text-slate-400 px-4 py-2 rounded-xl text-xs font-semibold cursor-not-allowed transition">แลกสิทธิ์</button>
                </div>

                <!-- Card Grid -->
                <div>
                    <h3 class="font-semibold text-sm mb-3 text-slate-700">🎴 คอลเลกชันวัตถุดิบทั้งหมด (แตะเพื่อดูรายละเอียด)</h3>
                    <div id="album-grid" class="grid grid-cols-2 gap-3"></div>
                </div>
            </div>
        </section>

        <!-- ================= STAFF TAB ================= -->
        <section id="tab-staff" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-amber-100 space-y-3">
                <h2 class="font-semibold text-slate-700">⚡ โหมดพนักงาน: สุ่มแจกการ์ด</h2>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">LINE UID / เบอร์ลูกค้า</label>
                    <input type="text" id="staff-uid" placeholder="ระบุตัวตนลูกค้า" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-500">
                </div>
                <button onclick="staffDrawCard()" class="w-full bg-slate-900 text-white py-3 rounded-xl text-sm font-medium hover:bg-slate-800 transition shadow-md">🎲 สุ่มแจกการ์ดให้ลูกค้า</button>
            </div>

            <div id="staff-result" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-pink-200 text-center space-y-2">
                <p class="text-xs text-pink-600 font-bold uppercase">🎉 แจกการ์ดสำเร็จ!</p>
                <div id="res-icon" class="text-5xl my-2">🍓</div>
                <h3 id="res-name" class="font-bold text-lg">-</h3>
                <p id="res-desc" class="text-xs text-slate-500">-</p>
            </div>
        </section>

    </main>

    <!-- Card Detail Modal -->
    <div id="card-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-xs rounded-3xl p-6 text-center space-y-4 shadow-2xl relative animate-in fade-in zoom-in duration-200">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold">✕</button>
            <div id="modal-icon" class="text-6xl my-2">🥣</div>
            <h3 id="modal-name" class="font-bold text-lg text-slate-800">-</h3>
            <span id="modal-rarity" class="inline-block px-3 py-1 rounded-full text-xs font-semibold">Common</span>
            <p id="modal-desc" class="text-xs text-slate-500 leading-relaxed">-</p>
        </div>
    </div>

    <script>
        // ตั้งค่า Supabase ของคุณ
        const SUPABASE_URL = 'https://rkqhbszezansedzdhhgf.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY'; // ใส่รหัส anon public ของคุณที่นี่
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const CATALOG = [
            { id: "c1", name: "Greek Original", rarity: "Common", desc: "เนื้อโยเกิร์ตเข้มข้นสูตรต้นตำรับ ละมุนลิ้น ทานเพลิน", icon: "🥣" },
            { id: "c2", name: "Wild Honey", rarity: "Common", desc: "น้ำผึ้งป่าดอกไม้แท้ 100% เพิ่มความหวานหอมธรรมชาติ", icon: "🍯" },
            { id: "c3", name: "Granola Crunchy", rarity: "Common", desc: "ธัญพืชคั่วกรอบสูตรลับเฉพาะ เคี้ยวสนุกอิ่มท้อง", icon: "🌾" },
            { id: "c4", name: "Fresh Strawberry", rarity: "Rare", desc: "สตอเบอร์รี่สดเกรดพรีเมียม ลูกโต รสเปรี้ยวอมหวาน", icon: "🍓" },
            { id: "c5", name: "Almond Roast", rarity: "Rare", desc: "อัลมอนด์อบสุกหอมกรุ่น เต็มเปี่ยมด้วยคุณประโยชน์", icon: "🥜" },
            { id: "c6", name: "Special Mascot Gurt", rarity: "Epic", desc: "การ์ดลับสุดพิเศษ หายากระดับตำนานของร้าน Gurt Yogreek!", icon: "🦄" }
        ];

        function switchTab(tab) {
            const isC = tab === 'customer';
            document.getElementById('tab-customer').classList.toggle('hidden', !isC);
            document.getElementById('tab-staff').classList.toggle('hidden', isC);
            document.getElementById('btn-customer').className = isC ? 'px-3 py-1.5 rounded-lg transition bg-white text-pink-600 shadow-sm' : 'px-3 py-1.5 rounded-lg transition text-slate-600';
            document.getElementById('btn-staff').className = !isC ? 'px-3 py-1.5 rounded-lg transition bg-white text-pink-600 shadow-sm' : 'px-3 py-1.5 rounded-lg transition text-slate-600';
        }

        // ฟังก์ชันดึงข้อมูลการ์ดของลูกค้า (มีระบบดักจับ Error และสร้างบัญชีอัตโนมัติ)
        async function loadAlbum() {
            const uid = document.getElementById('cust-uid').value.trim();
            if(!uid) { alert('กรุณากรอก UID หรือเบอร์โทรศัพท์'); return; }

            try {
                let { data, error } = await supabase.from('members').select('*').eq('line_uid', uid).maybeSingle();
                
                if (error) {
                    console.error("Supabase Select Error:", error);
                    alert('❌ เกิดข้อผิดพลาดในการดึงข้อมูล: ' + error.message);
                    return;
                }

                let cards = data ? data.cards || [] : [];

                if(!data)
